<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact · lifeng</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/fonts.css" />

  <body>
    <!-- One board, framed the way the sheet frames its plate: sharp corners,
         a hairline, the page's own paper. No card, no shadow, no dialog —
         the notice-board rectangle the masthead already speaks in. -->
    <main class="board" aria-labelledby="board-title">
      <div class="board-head">
        <a class="board-back" href="/"><span class="board-back-k">← back</span></a>
        <p class="board-kicker" id="board-title">contact me</p>
      </div>

      <dl class="board-list">
        <div class="board-row">
          <dt class="board-key">email</dt>
          <dd class="board-val"><a href="mailto:lf@lifeng.net">lf@lifeng.net</a></dd>
        </div>
        <div class="board-row">
          <dt class="board-key">email</dt>
          <dd class="board-val"><a href="mailto:lifengto@gmail.com">lifengto@gmail.com</a></dd>
        </div>
        <div class="board-row">
          <dt class="board-key">telegram</dt>
          <dd class="board-val"><a href="https://t.me/ifoux" rel="noopener">t.me/ifoux</a></dd>
        </div>
      </dl>
    </main>
  </body>
</html>
